<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Drea Planner 2026</title>
<style>
:root {
  --bg: #1c1a19;
  --bezel: #0e0d0c;
  --paper: #fffdfb;
  --paper-2: #fbf6f2;
  --ink: #2a2624;
  --muted: #8a7e7a;
  --line: #ecd9d4;
  --pink: #f4b7c4;
  --pink-d: #e59aaa;
  --pink-h: #f8c9d3;
  --gold: #c4a36a;
  --accent: #f4b7c4;
  --tab: #f7c5d0;
  --tab-ink: #5c3d44;
  --shadow: rgba(40, 20, 20, .18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
body {
  font-family: "Avenir Next", "Segoe UI", "Century Gothic", sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -10%, #3a322e 0%, var(--bg) 55%);
  color: var(--ink);
}
body.is-dragging { touch-action: none; user-select: none; -webkit-user-select: none; }
button, a { font-family: inherit; }
.ce:empty:before { content: attr(data-ph); color: #cbb8b4; }
.ce, input.plain, textarea.plain {
  outline: none; border: none; background: transparent;
  font: inherit; color: inherit; width: 100%;
}
input.plain, textarea.plain { resize: none; }

/* Device */
.app {
  height: 100%;
  height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr;
  min-height: 0;
}
.chrome {
  position: sticky;
  top: 0;
  z-index: 80;
  display: flex; flex-direction: column; gap: 4px;
  padding: max(8px, env(safe-area-inset-top)) 16px 8px;
  color: #e8ddd6; font-size: 12px; letter-spacing: .08em;
  background: #1c1a19;
}
.chrome strong { font-weight: 600; color: #fff; letter-spacing: .16em; text-transform: uppercase; }
.chrome .tools { display: flex; gap: 8px; flex-wrap: wrap; }
.chrome button {
  background: transparent; color: #e8ddd6; border: 1px solid #5a4f4a;
  border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: 12px; letter-spacing: .06em;
  min-height: 40px;
}
.chrome button:hover { border-color: var(--pink); color: #fff; }

.stage {
  display: flex; align-items: center; justify-content: center;
  padding: 0 12px max(12px, env(safe-area-inset-bottom));
  min-height: 0;
}
.device {
  width: min(1280px, 100%);
  height: 100%;
  max-height: 100%;
  background: var(--bezel);
  border-radius: 28px;
  padding: 14px;
  box-shadow: 0 40px 80px rgba(0,0,0,.45), inset 0 0 0 1px #2a2624;
  display: flex; flex-direction: column;
  min-height: 0;
}
.planner {
  flex: 1; min-height: 0;
  background: #e9e0d8;
  border-radius: 14px;
  display: grid;
  grid-template-rows: 44px 1fr;
  grid-template-columns: 32px 1fr 40px;
  overflow: hidden;
  position: relative;
}

/* Tabs */
.top-tabs {
  grid-column: 1 / -1;
  display: flex; justify-content: center; gap: 6px;
  padding: 6px 48px 0; background: #e9e0d8;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  flex-wrap: nowrap;
}
.tab {
  border: none; cursor: pointer; font-size: 9px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase;
  padding: 10px 12px 8px; border-radius: 8px 8px 0 0;
  background: var(--tab); color: var(--tab-ink);
  box-shadow: 0 -1px 0 rgba(255,255,255,.5) inset;
  flex: 0 0 auto;
  min-height: 36px;
}
.tab.active { filter: brightness(.96); transform: translateY(1px); font-weight: 800; }
.side-left, .side-right {
  display: flex; flex-direction: column; align-items: center;
  padding-top: 8px; gap: 4px; background: #e9e0d8;
  min-height: 0; overflow-y: auto;
}
.home-btn {
  width: 28px; height: 32px; border: none; border-radius: 0 6px 6px 0;
  background: var(--tab); cursor: pointer; color: var(--tab-ink); font-size: 14px;
}
.mtab {
  writing-mode: vertical-rl; transform: rotate(180deg);
  border: none; cursor: pointer;
  font-size: 8px; font-weight: 800; letter-spacing: .12em;
  padding: 10px 4px; border-radius: 6px 0 0 6px;
  background: var(--tab); color: var(--tab-ink); width: 32px;
}
.mtab.year { background: #2a2624; color: #f8c9d3; }
.mtab.active { width: 34px; filter: brightness(.93); }

.spread {
  display: grid;
  grid-template-columns: 1fr 26px 1fr;
  min-height: 0; background: var(--paper);
  box-shadow: 0 8px 24px var(--shadow);
  border-radius: 2px 0 0 2px;
}
.page {
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background:
    linear-gradient(90deg, rgba(0,0,0,.03), transparent 18px),
    var(--paper);
  font-size: 12px;
}
.page.right {
  background:
    linear-gradient(270deg, rgba(0,0,0,.03), transparent 18px),
    var(--paper-2);
}
.page-scroll {
  flex: 1;
  min-height: 0;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.ink-stack { position: relative; min-height: 100%; }
.page-body { position: relative; z-index: 1; padding: 16px 18px 14px; min-height: 100%; }
.ink-layer {
  position: absolute; left: 0; top: 0; z-index: 2;
  pointer-events: none;
  touch-action: none;
}
.page.fill .page-body { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.page.inking .page-scroll { touch-action: none; }
.spine {
  background: linear-gradient(90deg, #d7ccc6, #eee8e2 40%, #cfc4bc);
  display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
  box-shadow: inset 4px 0 8px rgba(0,0,0,.08), inset -4px 0 8px rgba(0,0,0,.08);
}
.ring {
  width: 18px; height: 10px; border-radius: 50%;
  background: linear-gradient(90deg, #9aa0a6, #e8ecef 45%, #6d7378);
  box-shadow: 0 1px 2px rgba(0,0,0,.35);
}

/* Page bits */
.pg-title {
  font-size: 22px; font-weight: 400; letter-spacing: .08em;
  text-transform: uppercase; color: var(--pink-d); margin-bottom: 10px;
}
.pg-kicker { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.hdr {
  background: var(--pink-h); color: #5c3d44; font-size: 10px; font-weight: 800;
  letter-spacing: .14em; text-transform: uppercase; padding: 5px 8px; margin: 8px 0 6px;
}
.hdr.y { background: #f6e3a8; }
.hdr.o { background: #f6c9a8; }
.hdr.g { background: #cfe8d4; }
.hdr.t { background: #c5e6e2; }
.hdr.b { background: #c9daf0; }
.hdr.v { background: #ddd0ee; }
.linkish {
  display: block; padding: 2px 0; cursor: pointer; color: var(--ink);
  border-bottom: 1px solid var(--line); font-size: 11px;
}
.linkish:hover { color: var(--pink-d); }
.cols { display: grid; gap: 8px; }
.cols-2 { grid-template-columns: 1fr 1fr; }
.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
.box {
  border: 1px solid var(--line); padding: 6px 8px; min-height: 42px;
  display: flex; flex-direction: column; gap: 2px;
}
.box > span, .lbl {
  font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700;
}
.line-list .ce { border-bottom: 1px solid var(--line); min-height: 18px; padding: 2px 0; }
.dots {
  background-image: radial-gradient(#e4d2cd 1px, transparent 1.2px);
  background-size: 10px 10px;
}
.ruled {
  background-image: repeating-linear-gradient(transparent 0 21px, #f0ddd8 21px 22px);
}
.gridp {
  background-image:
    linear-gradient(#efddd8 1px, transparent 1px),
    linear-gradient(90deg, #efddd8 1px, transparent 1px);
  background-size: 14px 14px;
}
.cal { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 11px; }
.cal th { font-size: 8px; letter-spacing: .1em; color: var(--muted); padding: 4px 0; font-weight: 700; }
.cal td {
  border: 1px solid var(--line); height: 62px; vertical-align: top; padding: 3px;
  cursor: pointer;
}
.cal td.empty { background: #faf6f4; cursor: default; }
.cal td.today { outline: 2px solid var(--pink-d); outline-offset: -2px; }
.cal .n { font-weight: 700; font-size: 11px; color: var(--pink-d); cursor: pointer; }
.cal .n:hover { text-decoration: underline; }
.habit-wrap { overflow-x: auto; }
.habit { width: max-content; min-width: 100%; }
.habit th, .habit td { text-align: center; padding: 1px; border: 1px solid var(--line); font-size: 8px; }
.habit .check { width: 12px; height: 12px; }
.cal .wk {
  width: 22px; border: none; cursor: pointer; background: var(--pink-h);
  font-size: 8px; font-weight: 800; color: #5c3d44;
}
.mini-cal { font-size: 9px; }
.mini-cal td { height: 18px; text-align: center; cursor: pointer; border: none; padding: 1px; }
.mini-cal .n { color: var(--ink); font-weight: 500; }
.tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile {
  aspect-ratio: 1.15; border-radius: 18px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  border: none; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  font-size: 11px; color: #3a3030; box-shadow: 0 4px 0 rgba(0,0,0,.04);
}
.tile svg { width: 36px; height: 36px; stroke: #6a6260; fill: none; stroke-width: 1.6; }
.check { display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; border: 1.5px solid var(--pink-d); border-radius: 3px;
  cursor: pointer; font-size: 11px; color: var(--pink-d); background: #fff; }
.check.on { background: var(--pink-h); }
.stars span { cursor: pointer; font-size: 18px; color: #ddd2cc; }
.stars span.on { color: #d4a017; }
.glasses span, .dots-track span {
  display: inline-block; width: 16px; height: 20px; margin: 0 2px; cursor: pointer;
  border: 1.5px solid #9ec4d4; border-radius: 0 0 8px 8px; background: #fff;
}
.glasses span.on { background: #9ec4d4; }
.dots-track span { width: 14px; height: 14px; border-radius: 50%; border-color: #8fbf8a; }
.dots-track span.on { background: #8fbf8a; }
.day-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 10px; }
.time-col { font-size: 10px; }
.time-row { display: grid; grid-template-columns: 38px 1fr; border-bottom: 1px solid var(--line); min-height: 18px; }
.time-row b { color: var(--muted); font-weight: 500; font-size: 9px; padding-top: 2px; }
.week-day { border: 1px solid var(--line); min-height: 78px; padding: 4px 6px; margin-bottom: 6px; cursor: pointer; }
.week-day strong { font-size: 10px; letter-spacing: .08em; color: var(--pink-d); }
.jar-wrap { display: flex; gap: 10px; align-items: stretch; }
.jar {
  width: 90px; height: 160px; border: 3px solid #c9a96e; border-radius: 8px 8px 28px 28px;
  position: relative; overflow: hidden; background: #fff;
}
.jar-fill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(#f6e27a, #e0b84e); }
.jar-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #5c3d44; }
.eq { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; min-height: 280px; }
.eq > div { border: 1px solid var(--line); padding: 8px; }
.eq h3 { font-size: 11px; margin-bottom: 6px; letter-spacing: .06em; }
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.chip { border: 1px solid var(--line); background: #fff; padding: 6px 10px; border-radius: 999px; cursor: pointer; font-size: 11px; }
.chip.on { background: var(--pink-h); border-color: var(--pink-d); }
.cover {
  height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  position: relative;
}
.cover .ornament {
  width: 120px; height: 120px; border: 1px solid var(--gold); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
}
.cover h1 { font-weight: 400; font-size: 42px; letter-spacing: .18em; text-transform: uppercase; }
.cover .year { font-size: 64px; color: var(--pink-d); letter-spacing: .12em; font-weight: 200; }
.cover .sub { margin-top: 10px; letter-spacing: .22em; text-transform: uppercase; font-size: 11px; color: var(--muted); }
.btn-open {
  margin-top: 28px; background: var(--ink); color: #fff; border: none;
  padding: 12px 28px; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; font-size: 11px;
}
.btn-open:hover { background: #4a3f3c; }
.wheel { width: 220px; height: 220px; margin: 8px auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 11px; }
table.data th, table.data td { border-bottom: 1px solid var(--line); padding: 4px; text-align: left; }
table.data th { font-size: 9px; letter-spacing: .1em; color: var(--muted); }
.add-row { margin-top: 6px; font-size: 11px; cursor: pointer; color: var(--pink-d); background: none; border: none; }
.warn { font-size: 10px; color: #a06050; background: #fbeee8; padding: 6px 8px; margin-bottom: 8px; }
.nav-mini { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.nav-mini button {
  background: var(--pink-h); border: none; padding: 4px 8px; cursor: pointer; font-size: 11px; color: #5c3d44;
}
.paper-icons { display: flex; gap: 8px; flex-wrap: wrap; }
.paper-icons button {
  width: 48px; height: 58px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 9px;
}
.toast {
  position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  background: #2a2624; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 90;
}
.toast.show { opacity: 1; }
.page.fill { display: flex; flex-direction: column; overflow: hidden; }
.chrome-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.penbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-top: 4px; }
.penbar button.on, .chrome button.on { background: #3a3330; border-color: var(--pink); color: #fff; }
.ink-swatch {
  width: 28px; height: 28px; min-height: 28px; padding: 0; border-radius: 50%;
  border: 2px solid #5a4f4a;
}
.ink-swatch.on { outline: 2px solid #fff; outline-offset: 1px; }
.board-kicker { font-size: 10px; letter-spacing: .04em; color: var(--muted); margin: -4px 0 8px; }
.board-grid {
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  gap: 8px; flex: 1; min-height: 0;
}
.lane {
  border: 1px dashed #e2d2cc; border-radius: 8px; padding: 6px 6px 4px;
  display: flex; flex-direction: column; min-height: 0; background: rgba(255,255,255,.55);
}
.lane.over { outline: 2px dashed var(--pink-d); background: #fff6f4; }
.lane.hot { outline: 2px solid #e59aaa; }
.lane-h { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; margin-bottom: 4px; }
.lane-h b { font-size: 12px; font-weight: 800; letter-spacing: .02em; text-transform: lowercase; }
.lane-h em { font-style: normal; font-size: 8px; color: var(--muted); font-weight: 600; }
.lane-hint { font-size: 8px; line-height: 1.25; color: var(--muted); margin-bottom: 4px; }
.lane-notes {
  flex: 1; overflow: auto; display: flex; flex-wrap: wrap;
  align-content: flex-start; gap: 6px; min-height: 48px;
}
.sticky {
  width: 104px; min-height: 104px; padding: 28px 8px 8px;
  font-size: 12px; line-height: 1.25; cursor: grab;
  box-shadow: 2px 3px 6px rgba(40,20,20,.12);
  position: relative; border: none; text-align: left;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
.sticky:nth-child(odd) { transform: rotate(-1.4deg); }
.sticky:nth-child(even) { transform: rotate(1.1deg); }
.sticky.y { background: #ffe566; }
.sticky.g { background: #c8e86a; }
.sticky.o { background: #ff9f43; color: #3a2412; }
.sticky.b { background: #7ec8e3; }
.sticky .ce {
  min-height: 56px; font-size: 13px;
  touch-action: auto; -webkit-user-select: text; user-select: text;
  cursor: text;
}
.sticky .x, .grip {
  position: absolute; top: 2px; border: none; background: none;
  cursor: pointer; font-size: 16px; opacity: .45; line-height: 1;
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  touch-action: none;
}
.sticky .x { right: 0; }
.grip { left: 0; cursor: grab; font-size: 14px; letter-spacing: -2px; }
.sticky .x:hover, .grip:hover { opacity: .85; }
.sticky.dragging { opacity: .3; }
.sticky.picked { outline: 3px solid #2a2624; outline-offset: 1px; z-index: 2; }
.sticky-ghost {
  position: fixed; z-index: 200; pointer-events: none; margin: 0;
  transform: rotate(5deg) scale(1.06);
  box-shadow: 6px 10px 20px rgba(0,0,0,.28);
}
.lane.drop-hint { background: #fff4ef; }
.pad-tools { display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; align-items: center; }
.swatch {
  width: 28px; height: 28px; border: 1px solid rgba(0,0,0,.15); cursor: pointer; border-radius: 4px;
}
.swatch.on { outline: 2px solid var(--ink); outline-offset: 1px; }
.pad-tools .add-row { min-height: 36px; font-size: 13px; padding: 6px 10px; }
@media (min-width: 1200px) and (min-height: 920px) {
  .device { height: min(860px, 100%); }
}
@media (max-width: 960px) {
  .device { border-radius: 16px; padding: 8px; }
  .spread { grid-template-columns: 1fr; grid-template-rows: minmax(0,1fr) minmax(0,1fr); }
  .spine { display: none; }
  .planner { grid-template-columns: 32px 1fr 36px; }
  .top-tabs { padding: 6px 8px 0; justify-content: flex-start; }
  .page { min-height: 0; }
  .board-grid { gap: 6px; }
  .lane-hint { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="chrome">
    <div class="chrome-row">
      <div><strong>Drea Planner</strong> · 2026</div>
      <div class="tools">
        <button type="button" data-nav="index">Index</button>
        <button type="button" data-nav="today">Heute</button>
        <button type="button" data-nav="board">Board</button>
        <button type="button" data-nav="settings">Farben</button>
        <button type="button" id="btnExport">Export</button>
        <button type="button" id="btnImport">Import</button>
      </div>
    </div>
    <div class="penbar" id="penbar">
      <button type="button" class="ink-swatch on" data-ink-color="#2a2624" style="background:#2a2624" title="Schwarz"></button>
      <button type="button" class="ink-swatch" data-ink-color="#c45c5c" style="background:#c45c5c" title="Rot"></button>
      <button type="button" class="ink-swatch" data-ink-color="#3d6ea8" style="background:#3d6ea8" title="Blau"></button>
      <button type="button" class="ink-swatch" data-ink-color="#e59aaa" style="background:#e59aaa" title="Rosa"></button>
      <button type="button" data-ink-w="1.6">Fein</button>
      <button type="button" data-ink-w="2.6" class="on">Mittel</button>
      <button type="button" data-ink-w="5">Stark</button>
      <button type="button" id="btnErase">Radierer</button>
      <button type="button" id="btnInkUndo">Rückgängig</button>
      <button type="button" id="btnInkClear">Leeren</button>
      <button type="button" id="btnFinger">Finger</button>
    </div>
  </div>
  <div class="stage">
    <div class="device">
      <div class="planner" id="planner">
        <div class="top-tabs" id="topTabs"></div>
        <div class="side-left"><button class="home-btn" data-nav="index" title="Index">⌂</button></div>
        <div class="spread">
          <div class="page" id="leftPage">
            <div class="page-scroll">
              <div class="ink-stack">
                <div class="page-body" id="left"></div>
                <canvas class="ink-layer" id="inkLeft"></canvas>
              </div>
            </div>
          </div>
          <div class="spine" id="spine"></div>
          <div class="page right" id="rightPage">
            <div class="page-scroll">
              <div class="ink-stack">
                <div class="page-body" id="right"></div>
                <canvas class="ink-layer" id="inkRight"></canvas>
              </div>
            </div>
          </div>
        </div>
        <div class="side-right" id="monthTabs"></div>
      </div>
    </div>
  </div>
</div>
<input type="file" id="importFile" accept="application/json" hidden />
<div class="toast" id="toast"></div>
<script>
(function () {
  const YEAR = 2026;
  const KEY = "drea-planner-2026-v1";
  const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const MSHORT = ["JAN","FEB","MÄR","APR","MAI","JUN","JUL","AUG","SEP","OKT","NOV","DEZ"];

  function iso(d) {
    const x = d instanceof Date ? d : new Date(d);
    return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0");
  }
  function parse(s) { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
  function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
  function get(path, fallback) {
    const v = path.split(".").reduce((o,k) => (o == null ? o : o[k]), data);
    return v == null ? fallback : v;
  }
  function set(path, val) {
    const keys = path.split(".");
    let o = data;
    for (let i = 0; i < keys.length - 1; i++) {
      if (typeof o[keys[i]] !== "object" || o[keys[i]] == null) o[keys[i]] = {};
      o = o[keys[i]];
    }
    o[keys[keys.length-1]] = val;
    save();
  }
  function load() {
    try {
      const raw = Object.assign(defaults(), JSON.parse(localStorage.getItem(KEY) || "null") || {});
      raw.settings = Object.assign({ theme: "rosa", owner: "", pen: { color: "#2a2624", width: 2.6, erase: false, finger: false } }, raw.settings || {});
      raw.settings.pen = Object.assign({ color: "#2a2624", width: 2.6, erase: false, finger: false }, raw.settings.pen || {});
      if (!raw.ink) raw.ink = {};
      return raw;
    }
    catch (e) { return defaults(); }
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(data)); }
  function defaults() {
    return {
      settings: { theme: "rosa", owner: "", pen: { color: "#2a2624", width: 2.6, erase: false, finger: false } },
      daily: {}, weekly: {}, monthly: {}, cal: {},
      finance: {}, savings: { for: "", goal: "", until: "", motivation: "", entries: [] },
      subs: [],
      projects: Array.from({length:10}, () => ({title:"",prio:0,start:"",end:"",notes:""})),
      notebooks: Array.from({length:10}, () => ({title:"",body:""})),
      goals: Array.from({length:10}, () => ({title:"",why:"",steps:"",deadline:"",done:0})),
      habits: [{n:"Wasser"},{n:"Bewegen"},{n:"Lesen"},{n:"Meditieren"},{n:"Früh schlafen"}],
      habitDays: {},
      routines: { morning: ["","",""], evening: ["","",""], week: {} },
      tasks: [],
      eisenhower: { ui:"", uni:"", nui:"", nuni:"" },

      fitness: {}, body: { weight:"", sleep:"", notes:"" }, vitamins: "", gifts: "",
      trips: { dest:"", days:"", packing:"", notes:"" },
      events: "", movies: "", books: "", wishlist: "", vorsaetze: "",
      wheel: { Gesundheit:6, Karriere:5, Finanzen:4, Familie:7, Romantik:5, Freunde:6, Wachstum:5, Spass:6 },
      study: { subject:"", exam:"", notes:"", plan:"" },

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1600);
  }
  function applyTheme() {
    const th = THEMES[data.settings.theme] || THEMES.rosa;
    const r = document.documentElement.style;
    r.setProperty("--accent", th.accent);
    r.setProperty("--tab", th.tab);
    r.setProperty("--pink", th.accent);
    r.setProperty("--pink-d", th.d);
    r.setProperty("--pink-h", th.tab);
  }
  function isoWeek(d) {
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - day);
    const ys = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
    return Math.ceil((((date - ys) / 86400000) + 1) / 7);
  }
  function mondayOf(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const day = x.getDay() || 7;
    x.setDate(x.getDate() - day + 1);
    return x;
  }
  function monthCells(y, m) {
    const first = new Date(y, m-1, 1);
    let dow = first.getDay(); dow = dow === 0 ? 6 : dow - 1;
    const n = new Date(y, m, 0).getDate();
    const cells = Array(dow).fill(null);
    for (let i = 1; i <= n; i++) cells.push(i);
    while (cells.length % 7) cells.push(null);
    return cells;
  }
  function ce(path, ph, cls) {
    return `<div class="ce ${cls||""}" contenteditable="true" data-path="${path}" data-ph="${ph||""}">${esc(get(path,""))}</div>`;
  }
  function inp(path, ph) {
    return `<input class="plain" data-path="${path}" data-ph="${ph||""}" placeholder="${ph||""}" value="${esc(get(path,""))}" />`;
  }

  function renderChrome() {
    document.getElementById("topTabs").innerHTML = TOP.map(([id,label]) =>

    document.getElementById("monthTabs").innerHTML =
      `<button class="mtab year ${nav.view==="year"?"active":""}" data-nav="year">2026</button>` +
      MSHORT.map((m,i) => `<button class="mtab ${nav.view==="month"&&nav.month===i+1?"active":""}" data-nav="month:${i+1}">${m}</button>`).join("");
    document.getElementById("spine").innerHTML = Array.from({length:20}, () => `<i class="ring"></i>`).join("");
  }

  function go(spec) {
    const [view, arg] = String(spec).split(":");
    if (view === "today") { nav.view = "day"; nav.date = todayStr; nav.month = Number(todayStr.slice(5,7)); }
    else if (view === "month") { nav.view = "month"; nav.month = Number(arg); }
    else if (view === "day") { nav.view = "day"; nav.date = arg; nav.month = Number(arg.slice(5,7)); }
    else if (view === "week") { nav.view = "week"; nav.date = arg; nav.month = Number(arg.slice(5,7)); }
    else if (view === "finm") { nav.view = "finm"; nav.month = Number(arg); }
    else if (view === "review") { nav.view = "review"; nav.month = Number(arg); }
    else if (view === "project") { nav.view = "project"; nav.n = Number(arg); }
    else if (view === "nb") { nav.view = "nb"; nav.n = Number(arg); }
    else if (view === "goal") { nav.view = "goal"; nav.n = Number(arg); }
    else if (view === "paper") { nav.view = "paper"; nav.paper = arg || "lined"; }
    else nav.view = view;
    const hash = view === "today" ? "day:" + todayStr : spec;
    if (location.hash.slice(1) !== hash) history.replaceState(null, "", "#" + hash);
    render();
  }

  function yearPage() {
    const minis = MONTHS.map((name,i) => {
      const cells = monthCells(YEAR, i+1);
      let html = `<div><div class="hdr" data-nav="month:${i+1}" style="cursor:pointer">${name}</div>
        <table class="cal mini-cal"><tr>${DSHORT.map(d=>`<th>${d}</th>`).join("")}</tr><tr>`;
      cells.forEach((c,idx) => {
        if (idx && idx%7===0) html += "</tr><tr>";
        const ds = c ? `${YEAR}-${String(i+1).padStart(2,"0")}-${String(c).padStart(2,"0")}` : "";
        html += `<td class="${c?"":"empty"}" ${c?`data-nav="day:${ds}"`:""}>${c?`<span class="n">${c}</span>`:""}</td>`;
      });
      return html + "</tr></table></div>";
    });
    return { left: `<h2 class="pg-title">2026</h2><div class="cols cols-2">${minis.slice(0,6).join("")}</div>`,
             right: `<div class="pg-kicker">Jahresübersicht</div><div class="cols cols-2">${minis.slice(6).join("")}</div>` };
  }

  function monthPage(m) {
    const cells = monthCells(YEAR, m);
    const weeks = [];
    for (let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
    let table = `<table class="cal"><tr><th></th>${DAYS.map(d=>`<th>${d.slice(0,2)}</th>`).join("")}</tr>`;
    weeks.forEach(w => {
      const first = w.find(Boolean);
      const d0 = first ? new Date(YEAR, m-1, first) : null;
      const mon = d0 ? iso(mondayOf(d0)) : "";
      table += `<tr><td class="wk" ${mon?`data-nav="week:${mon}"`:""}>KW</td>`;
      w.forEach(c => {
        if (!c) { table += `<td class="empty"></td>`; return; }
        const ds = `${YEAR}-${String(m).padStart(2,"0")}-${String(c).padStart(2,"0")}`;
        const note = get("cal."+ds, "");
        const isT = ds === todayStr;
        table += `<td class="${isT?"today":""}"><div class="n" data-nav="day:${ds}">${c}</div>${ce("cal."+ds,"")}</td>`;
      });
      table += "</tr>";
    });
    table += "</table>";
    return {
      left: `<div class="nav-mini"><button data-nav="month:${m===1?12:m-1}">←</button>

  function habitTable(m) {
    const days = new Date(YEAR, m, 0).getDate();
    let h = `<table class="data habit"><tr><th></th>`;
    for (let d=1;d<=days;d++) h += `<th>${d}</th>`;
    h += "</tr>";
    (data.habits||[]).forEach((hab, hi) => {
      h += `<tr><td style="text-align:left;min-width:70px">${ce("habits."+hi+".n","Habit")}</td>`;
      for (let d=1;d<=days;d++) {
        const key = `${YEAR}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}:${hi}`;
        const on = data.habitDays[key] ? "on" : "";
        h += `<td><span class="check ${on}" data-toggle="habitDays.${key}"></span></td>`;
      }
      h += "</tr>";
    });
    return `<div class="habit-wrap">${h}</table></div>`;
  }

      const ds = iso(d);
      return `<div class="week-day">
        <strong data-nav="day:${ds}" style="cursor:pointer">${String(d.getDate()).padStart(2,"0")} / ${DAYS[d.getDay()===0?6:d.getDay()-1].toUpperCase()}</strong>

      </div>`;
    };
    const prev = iso(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()-7));
    const next = iso(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+7));
    return {
      left: `<div class="nav-mini"><button data-nav="week:${prev}">←</button>
        <h2 class="pg-title" style="margin:0">${MONTHS[mon.getMonth()]} ${YEAR} / KW ${kw}</h2>

      right: `${days.slice(4).map(block).join("")}

        ${ce("weekly."+kw+".notes","", "dots")}`
    };
  }

    const inc = get(key+".inc", []);
    const exp = get(key+".exp", []);
    const ti = inc.reduce((a,x)=>a+(parseFloat(x.a)||0),0);
    const te = exp.reduce((a,x)=>a+(parseFloat(x.a)||0),0);
    const row = (arr, path) => arr.map((x,i)=>`<tr><td>${inp(path+"."+i+".n","")}</td><td>${inp(path+"."+i+".a","0")}</td></tr>`).join("");

      left: `<h2 class="pg-title">Finanzen · ${MONTHS[m-1]}</h2>

        <table class="data"><tr><th>Posten</th><th>€</th></tr>${row(inc, key+".inc")}</table>
        <button class="add-row" id="addInc">+ Einnahme</button>
        <div>Summe: <strong>${ti.toFixed(2)} €</strong></div>`,
      right: `<div class="hdr">Ausgaben</div>

  function boardLane(lane) {
    ensureBoard();
    const notes = data.board.notes.filter(n => n.lane === lane.id);
    const wip = lane.wip ? `<em>${notes.length}/${lane.wip}</em>` : `<em>${notes.length}</em>`;
    const hot = lane.wip && notes.length > lane.wip ? " hot" : "";
    const pad = lane.pad ? `<div class="pad-tools">
        <button type="button" class="swatch y ${data.board.color==="y"?"on":""}" data-board-color="y" style="background:#ffe566"></button>
        <button type="button" class="swatch g ${data.board.color==="g"?"on":""}" data-board-color="g" style="background:#c8e86a"></button>

        <button type="button" class="add-row" data-board-add="1">+ Zettel</button>
      </div>` : "";
    return `<section class="lane${hot}" data-lane="${lane.id}">
      <div class="lane-h"><b>${lane.title}</b>${wip}</div>

  function lebensrad() {
    const keys = Object.keys(data.wheel);
    const cx=110, cy=110, r=90;
    const pts = keys.map((k,i) => {
      const v = Number(data.wheel[k])||0;
      const a = (Math.PI*2*i)/keys.length - Math.PI/2;
      const rr = r * v / 10;
      return `${cx+Math.cos(a)*rr},${cy+Math.sin(a)*rr}`;
    }).join(" ");
    const labels = keys.map((k,i) => {
      const a = (Math.PI*2*i)/keys.length - Math.PI/2;
      return `<text x="${cx+Math.cos(a)*102}" y="${cy+Math.sin(a)*102}" text-anchor="middle" font-size="8">${k}</text>`;
    }).join("");
    const sliders = keys.map(k => `<div class="lbl">${k} · ${data.wheel[k]}</div>
      <input type="range" min="1" max="10" data-path="wheel.${k}" value="${data.wheel[k]}" />`).join("");
    return {
      left: `<h2 class="pg-title">Lebensrad</h2>
        <svg class="wheel" viewBox="0 0 220 220">
          ${[2,4,6,8,10].map(v => `<circle cx="110" cy="110" r="${9*v}" fill="none" stroke="#ecd9d4"/>`).join("")}
          <polygon points="${pts}" fill="rgba(229,154,170,.35)" stroke="#e59aaa" />
          ${labels}
        </svg>`,
      right: `<div class="hdr">Bewertung 1–10</div>${sliders}
        <div class="hdr">Fokus diese Woche</div>${ce("wheel.focus","","ruled")}`
    };
  }

  const inkSides = {
    left: { page: null, scroll: null, canvas: null, ctx: null },
    right: { page: null, scroll: null, canvas: null, ctx: null }
  };
  let inkStroke = null;
  let lastInkSide = "left";

  function inkKey(side) {
    return [nav.view, nav.date || "", nav.month || "", nav.n || "", nav.paper || "", side].join(":");
  }
  function inkStrokes(side) {
    if (!data.ink) data.ink = {};
    const k = inkKey(side);
    if (!Array.isArray(data.ink[k])) data.ink[k] = [];
    return data.ink[k];
  }
  function inkAccept(e) {
    if (e.pointerType === "pen") return true;
    if (data.settings.pen.finger && (e.pointerType === "mouse" || e.pointerType === "touch")) return true;
    return false;
  }
  function inkPoint(scroll, e) {
    const r = scroll.getBoundingClientRect();
    return {
      x: e.clientX - r.left + scroll.scrollLeft,
      y: e.clientY - r.top + scroll.scrollTop,
      p: e.pressure > 0 ? e.pressure : 0.5
    };
  }
  function drawStroke(ctx, s) {
    const pts = s.points;
    if (!pts || !pts.length) return;
    ctx.save();
    ctx.globalCompositeOperation = s.erase ? "destination-out" : "source-over";
    ctx.strokeStyle = s.erase ? "#000" : s.color;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    if (pts.length === 1) {
      ctx.beginPath();
      ctx.arc(pts[0].x, pts[0].y, (s.width * (0.4 + (pts[0].p || 0.5))) / 2, 0, Math.PI * 2);
      ctx.fillStyle = ctx.strokeStyle;
      ctx.fill();
      ctx.restore();
      return;
    }
    for (let i = 1; i < pts.length; i++) {
      ctx.beginPath();
      ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
      ctx.lineTo(pts[i].x, pts[i].y);
      ctx.lineWidth = s.width * (0.45 + (pts[i].p || 0.5));
      ctx.stroke();
    }
    ctx.restore();
  }
  function sizeInkSide(side) {
    const slot = inkSides[side];
    const page = slot.page;
    const canvas = slot.canvas;
    const scroll = page.querySelector(".page-scroll");
    const stack = page.querySelector(".ink-stack");
    slot.scroll = scroll;
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(scroll.clientWidth, stack.clientWidth, 1);
    const h = Math.max(scroll.scrollHeight, stack.scrollHeight, scroll.clientHeight, 1);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    slot.ctx = ctx;
    inkStrokes(side).forEach(s => drawStroke(ctx, s));
  }
  function syncInk() {
    sizeInkSide("left");
    sizeInkSide("right");
  }
  function syncPenbar() {
    const p = data.settings.pen;
    document.querySelectorAll("[data-ink-color]").forEach(b => b.classList.toggle("on", b.dataset.inkColor === p.color && !p.erase));
    document.querySelectorAll("[data-ink-w]").forEach(b => b.classList.toggle("on", Number(b.dataset.inkW) === p.width));
    document.getElementById("btnErase").classList.toggle("on", !!p.erase);
    document.getElementById("btnFinger").classList.toggle("on", !!p.finger);
  }
  function bindInkLayers() {
    inkSides.left.page = document.getElementById("leftPage");
    inkSides.left.canvas = document.getElementById("inkLeft");
    inkSides.right.page = document.getElementById("rightPage");
    inkSides.right.canvas = document.getElementById("inkRight");

    function onDown(e, side) {
      if (!inkAccept(e)) return;
      if (e.target.closest(".chrome, .tab, .mtab, .home-btn")) return;
      e.preventDefault();
      lastInkSide = side;
      inkSides[side].page.classList.add("inking");
      const p = data.settings.pen;
      inkStroke = {
        side,
        color: p.color,
        width: p.erase ? Math.max(10, p.width * 4) : p.width,
        erase: !!p.erase,
        points: [inkPoint(inkSides[side].scroll, e)]
      };
      drawStroke(inkSides[side].ctx, inkStroke);
      try { inkSides[side].page.setPointerCapture(e.pointerId); } catch (_) {}
    }
    function onMove(e) {
      if (!inkStroke || !inkAccept(e)) {
        if (inkStroke && e.pointerType === "touch") e.preventDefault();
        return;
      }
      e.preventDefault();
      const slot = inkSides[inkStroke.side];
      const pt = inkPoint(slot.scroll, e);
      const last = inkStroke.points[inkStroke.points.length - 1];
      if (Math.hypot(pt.x - last.x, pt.y - last.y) < 1.2) return;
      inkStroke.points.push(pt);
      drawStroke(slot.ctx, { color: inkStroke.color, width: inkStroke.width, erase: inkStroke.erase, points: [last, pt] });
    }
    function onUp() {
      if (!inkStroke) return;
      const side = inkStroke.side;
      inkSides[side].page.classList.remove("inking");
      if (inkStroke.points.length) {
        inkStrokes(side).push({
          color: inkStroke.color,
          width: inkStroke.width,
          erase: inkStroke.erase,
          points: inkStroke.points
        });
        save();
      }
      inkStroke = null;
    }

    ["left", "right"].forEach(side => {
      const page = inkSides[side].page;
      page.addEventListener("pointerdown", e => onDown(e, side), { passive: false });
    });
    window.addEventListener("pointermove", onMove, { passive: false });
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    window.addEventListener("resize", () => syncInk());
  }

  function render() {
    applyTheme();
    renderChrome();
    const p = pages();
    document.getElementById("left").innerHTML = p.left;
    document.getElementById("right").innerHTML = p.right;
    document.getElementById("left").classList.toggle("fill", nav.view === "board");
    document.getElementById("right").classList.toggle("fill", nav.view === "board");
    document.getElementById("leftPage").classList.toggle("fill", nav.view === "board");
    document.getElementById("rightPage").classList.toggle("fill", nav.view === "board");
    bindDynamic();
    syncInk();
    syncPenbar();
  }

  function bindDynamic() {
    const addSave = document.getElementById("addSave");
    if (addSave) addSave.onclick = () => { data.savings.entries.push({amt:"",date:"",note:""}); save(); render(); };
    const addSub = document.getElementById("addSub");
    if (addSub) addSub.onclick = () => { data.subs.push({name:"",monthly:"",renew:""}); save(); render(); };
    const addTask = document.getElementById("addTask");
    if (addTask) addTask.onclick = () => { data.tasks.push({t:"",on:false}); save(); render(); };
    const addInc = document.getElementById("addInc");
    if (addInc) addInc.onclick = () => {
      const m = nav.month; if (!data.finance[m]) data.finance[m] = {};
      if (!Array.isArray(data.finance[m].inc)) data.finance[m].inc = [];
      data.finance[m].inc.push({n:"",a:""}); save(); render();
    };
    const addExp = document.getElementById("addExp");
    if (addExp) addExp.onclick = () => {
      const m = nav.month; if (!data.finance[m]) data.finance[m] = {};
      if (!Array.isArray(data.finance[m].exp)) data.finance[m].exp = [];
      data.finance[m].exp.push({n:"",a:""}); save(); render();
    };
    const wipe = document.getElementById("wipe");
    if (wipe) wipe.onclick = () => { if (confirm("Wirklich alle Planerdaten löschen?")) { data = defaults(); save(); render(); toast("Zurückgesetzt"); } };
    bindBoard();
  }

  function moveBoardNote(id, lane) {
    ensureBoard();
    const note = data.board.notes.find(n => n.id === id);
    if (!note || note.lane === lane) return;
    if (lane === "doing") {
      const n = data.board.notes.filter(x => x.lane === "doing" && x.id !== id).length;
      if (n >= 3) toast("doing: max. 3 aktuelle To-dos — so verzettelst du dich nicht");
    }
    note.lane = lane;
    boardPicked = null;
    save();
    render();
  }
  function bindBoard() {
    if (nav.view !== "board") return;
    document.querySelectorAll(".lane").forEach(l => l.classList.toggle("drop-hint", !!boardPicked));
    if (boardPicked) {
      const sel = document.querySelector('.sticky[data-note-id="' + boardPicked + '"]');
      if (sel) sel.classList.add("picked");
      else boardPicked = null;
    }

    function laneAt(x, y, ghost) {
      if (ghost) ghost.style.visibility = "hidden";
      const under = document.elementFromPoint(x, y);
      if (ghost) ghost.style.visibility = "visible";
      return under && under.closest(".lane");
    }
    function markLane(lane) {
      document.querySelectorAll(".lane").forEach(l => l.classList.toggle("over", l === lane));
    }

    document.querySelectorAll(".sticky").forEach(el => {
      const id = el.dataset.noteId;
      let startX = 0, startY = 0, moved = false, dragging = null;

      function onMove(e) {
        const x = e.clientX, y = e.clientY;
        if (!dragging && Math.hypot(x - startX, y - startY) > 8) {
          const r = el.getBoundingClientRect();
          const ghost = el.cloneNode(true);
          ghost.classList.add("sticky-ghost");
          ghost.style.left = r.left + "px";
          ghost.style.top = r.top + "px";
          ghost.style.width = r.width + "px";
          ghost.style.height = r.height + "px";
          document.body.appendChild(ghost);
          el.classList.add("dragging");
          document.body.classList.add("is-dragging");
          dragging = { ghost, dx: x - r.left, dy: y - r.top };
        }
        if (!dragging) return;
        e.preventDefault();
        moved = true;
        dragging.ghost.style.left = (x - dragging.dx) + "px";
        dragging.ghost.style.top = (y - dragging.dy) + "px";
        markLane(laneAt(x, y, dragging.ghost));
      }
      function onUp(e) {
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onUp);
        document.body.classList.remove("is-dragging");
        if (dragging) {
          const lane = laneAt(e.clientX, e.clientY, dragging.ghost);
          dragging.ghost.remove();
          el.classList.remove("dragging");
          markLane(null);
          dragging = null;
          if (lane) moveBoardNote(id, lane.dataset.lane);
          return;
        }
        if (!moved) {
          boardPicked = boardPicked === id ? null : id;
          document.querySelectorAll(".sticky").forEach(s => s.classList.toggle("picked", s.dataset.noteId === boardPicked));
          document.querySelectorAll(".lane").forEach(l => l.classList.toggle("drop-hint", !!boardPicked));
          if (boardPicked) toast("Jetzt ein Feld antippen");
        }
      }

      el.addEventListener("pointerdown", e => {
        if (e.pointerType === "pen") return;
        if (e.target.closest(".x, [data-note-text]")) return;
        if (e.pointerType === "mouse" && e.button !== 0) return;
        e.preventDefault();
        startX = e.clientX; startY = e.clientY; moved = false; dragging = null;
        window.addEventListener("pointermove", onMove, { passive: false });
        window.addEventListener("pointerup", onUp);
        window.addEventListener("pointercancel", onUp);
      });
    });

    document.querySelectorAll(".lane").forEach(lane => {
      lane.addEventListener("click", e => {
        if (!boardPicked) return;
        if (e.target.closest(".sticky, [data-board-add], [data-board-color], .x, .grip")) return;
        moveBoardNote(boardPicked, lane.dataset.lane);
      });
    });
  }

  document.addEventListener("click", (e) => {
    const theme = e.target.closest("[data-theme]");
    if (theme) { data.settings.theme = theme.dataset.theme; save(); render(); return; }
    const add = e.target.closest("[data-sticker-add]");
    if (add) {
      if (!data.stickers) data.stickers = [];
      data.stickers.push(add.dataset.stickerAdd);
      save(); render(); return;
    }
    const color = e.target.closest("[data-board-color]");
    if (color) { ensureBoard(); data.board.color = color.dataset.boardColor; save(); render(); return; }
    const addNote = e.target.closest("[data-board-add]");
    if (addNote) {
      ensureBoard();
      data.board.notes.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        text: "",
        lane: "pad",
        color: data.board.color || "y"
      });
      save(); render(); return;
    }
    const delNote = e.target.closest("[data-board-del]");
    if (delNote) {
      ensureBoard();
      data.board.notes = data.board.notes.filter(n => n.id !== delNote.dataset.boardDel);
      save(); render(); return;
    }
    const del = e.target.closest("[data-sticker-del]");
    if (del) {
      data.stickers.splice(Number(del.dataset.stickerDel), 1);
      save(); render(); return;
    }
    const tog = e.target.closest("[data-toggle]");
    if (tog) {
      const path = tog.dataset.toggle;
      const cur = get(path, false);
      set(path, !cur);
      render();
      return;
    }
    const star = e.target.closest("[data-star]");
    if (star) {
      const [path, n] = star.dataset.star.split(":");
      set(path, Number(n));
      render();
      return;
    }
    const n = e.target.closest("[data-nav]");
    if (n && !e.target.closest("[data-path], input, textarea, [data-note-text], .sticky, .grip")) { go(n.dataset.nav); }
  });

  document.addEventListener("input", (e) => {
    const noteEl = e.target.closest("[data-note-text]");
    if (noteEl) {
      ensureBoard();
      const note = data.board.notes.find(n => n.id === noteEl.dataset.noteText);
      if (note) { note.text = noteEl.innerText; save(); }
      return;
    }
    const el = e.target.closest("[data-path]");
    if (!el) return;
    const val = el.tagName === "INPUT" || el.tagName === "TEXTAREA" ? el.value : el.innerText;
    set(el.dataset.path, el.type === "range" ? Number(val) : val);
    if (el.type === "range") render();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (e.target && e.target.isContentEditable) { e.target.blur(); return; }
      go("index");
    }
  });

  document.getElementById("penbar").addEventListener("click", (e) => {
    const color = e.target.closest("[data-ink-color]");
    if (color) {
      data.settings.pen.color = color.dataset.inkColor;
      data.settings.pen.erase = false;
      save(); syncPenbar(); return;
    }
    const w = e.target.closest("[data-ink-w]");
    if (w) {
      data.settings.pen.width = Number(w.dataset.inkW);
      save(); syncPenbar(); return;
    }
  });
  document.getElementById("btnErase").onclick = () => {
    data.settings.pen.erase = !data.settings.pen.erase;
    save(); syncPenbar();
    toast(data.settings.pen.erase ? "Radierer an" : "Stift an");
  };
  document.getElementById("btnFinger").onclick = () => {
    data.settings.pen.finger = !data.settings.pen.finger;
    save(); syncPenbar();
    toast(data.settings.pen.finger ? "Finger/Maus schreibt auch" : "Nur Pencil schreibt");
  };
  document.getElementById("btnInkUndo").onclick = () => {
    let strokes = inkStrokes(lastInkSide);
    if (!strokes.length) lastInkSide = lastInkSide === "left" ? "right" : "left";
    strokes = inkStrokes(lastInkSide);
    strokes.pop();
    save(); syncInk();
  };
  document.getElementById("btnInkClear").onclick = () => {
    if (!confirm("Handschrift auf diesen beiden Seiten löschen?")) return;
    data.ink[inkKey("left")] = [];
    data.ink[inkKey("right")] = [];
    save(); syncInk();
  };

  document.getElementById("btnExport").onclick = () => {
    const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "drea-planner-2026.json";
    a.click();
    toast("Exportiert");
  };
  document.getElementById("btnImport").onclick = () => document.getElementById("importFile").click();
  document.getElementById("importFile").onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try {
      data = Object.assign(defaults(), JSON.parse(r.result));
      data.settings = Object.assign(defaults().settings, data.settings || {});
      data.settings.pen = Object.assign(defaults().settings.pen, data.settings.pen || {});
      if (!data.ink) data.ink = {};
      save(); render(); toast("Importiert");
    } catch(err){ toast("Ungültige Datei"); } };
    r.readAsText(f);
  };

  bindInkLayers();
  applyTheme();
  if (location.hash.length > 1) go(decodeURIComponent(location.hash.slice(1)));
  else render();
})();
</script>
</body>
</html>
